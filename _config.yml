title: "Ori Marash"
description: "Ori Marash is a programmer. Write-ups on Rails, productivity systems, AI, and side projects."
author: "Ori Marash"

# Served at the custom apex domain orimarash.com (see CNAME), so no baseurl prefix.
url: "https://orimarash.com"
baseurl: ""

twitter:
  username: "penguoir"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
highlighter: rouge

permalink: /:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
