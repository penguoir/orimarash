title: "Ori Marash"
description: "Ori Marash is a programmer. Write-ups on Rails, productivity systems, AI, and side projects."
author: "Ori Marash"

# Hosted as a GitHub Pages project site at https://penguoir.github.io/orimarash
url: "https://penguoir.github.io"
baseurl: "/orimarash"

twitter:
  username: "penguoir"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
highlighter: rouge

permalink: /:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
